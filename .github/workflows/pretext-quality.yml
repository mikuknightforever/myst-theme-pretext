name: Pretext quality

on:
  push:
    branches: [main, 'feat/pretext-*']
    paths:
      - 'packages/**'
      - 'themes/article/**'
      - 'scripts/check-pretext.mjs'
      - '.github/workflows/pretext-quality.yml'
      - '.eslintrc.js'
      - '.prettier*'
      - 'package.json'
      - 'turbo.json'
      - 'patches/**'
      - 'bun.lock'
      - 'bun.lockb'
  pull_request:
    paths:
      - 'packages/**'
      - 'themes/article/**'
      - 'scripts/check-pretext.mjs'
      - '.github/workflows/pretext-quality.yml'
      - '.eslintrc.js'
      - '.prettier*'
      - 'package.json'
      - 'turbo.json'
      - 'patches/**'
      - 'bun.lock'
      - 'bun.lockb'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run quality:pretext
